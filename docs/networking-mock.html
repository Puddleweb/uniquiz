ts simultaneously send traffic intended to exhaust a service's capacity. Which description is most specific?", "answer": 1, "explanation": "A distributed denial-of-service attack uses multiple sources to exhaust or disrupt a target. An outage alone would not prove this cause; the scenario supplies attack intent and distribution.", "objective": "Identify distributed resource exhaustion.", "refs": ["ddos"], "options": ["Passive eavesdropping", "Distributed denial of service", "Legitimate route convergence", "Normal lease renewal"]}, {"id": "net-mock-20261029-082", "topic": "threats", "type": "single", "prompt": "A service accumulates many incomplete TCP connection attempts that consume connection-state resources. Which mechanism fits?", "answer": 0, "explanation": "A SYN flood targets resources used for connection establishment. This differs from flooding a link with arbitrary volume or tampering with application input.", "objective": "Recognise incomplete-handshake exhaustion.", "refs": ["tcp", "ddos"], "options": ["SYN flooding", "DNS zone transfer", "NTP clock drift", "DHCP address renewal"]}, {"id": "net-mock-20261029-083", "topic": "threats", "type": "single", "prompt": "A resolver cache contains a forged mapping for a legitimate service name, sending later users to the wrong address. What is the principal mechanism?", "answer": 2, "explanation": "DNS poisoning supplies false name-resolution data. ARP poisoning instead targets local IPv4-to-hardware address mappings.", "objective": "Identify the data structure poisoned in DNS attacks.", "refs": ["dns"], "options": ["ARP cache corruption", "MAC learning ageing", "DNS cache poisoning", "Wireless channel interference"]}, {"id": "net-mock-20261029-084", "topic": "threats", "type": "single", "prompt": "A local attacker convinces hosts that the gateway IPv4 address belongs to the attacker's MAC address. Which mechanism is involved?", "answer": 3, "explanation": "False ARP information can redirect local traffic intended for a gateway. This targets local neighbour resolution, rather than DNS names.", "objective": "Recognise local neighbour impersonation.", "refs": ["arp"], "options": ["SMTP relay", "TCP flow control", "DHCP lease expiry", "ARP poisoning"]}, {"id": "net-mock-20261029-085", "topic": "threats", "type": "multiple", "prompt": "Select TWO statements that correctly describe source-IP spoofing.", "answer": [0, 3], "explanation": "A forged source address is not authentication. Replies may go to the impersonated address, so spoofing alone does not establish a working two-way session.", "objective": "Explain spoofing and its limits.", "refs": ["ip"], "options": ["A packet can claim a source address that is not the sender's actual address", "It automatically gives the attacker the legitimate host's password", "It guarantees the attacker receives replies sent to the claimed address", "The source-address field alone should not be treated as strong identity proof"], "select": 2}, {"id": "net-mock-20261029-086", "topic": "threats", "type": "multiple", "prompt": "A login value is concatenated directly into an SQL command. Select TWO measures most directly relevant to preventing SQL injection in that operation.", "answer": [0, 2], "explanation": "Parameterisation keeps data separate from command structure; suitable validation adds defence. Network layout does not repair unsafe query construction.", "objective": "Select controls for an injection mechanism.", "refs": ["owasp"], "options": ["Use parameterised queries", "Rely only on perimeter traffic filtering", "Validate input according to the expected data", "Use encryption while retaining the unsafe query construction"], "select": 2}, {"id": "net-mock-20261029-087", "topic": "threats", "type": "truefalse", "prompt": "A person can be deceived by a phishing message even when the message was transported over an encrypted connection.", "answer": true, "explanation": "Encryption protects a channel; it does not ensure the sender's story or request is trustworthy. Social engineering targets human judgement and workflow.", "objective": "Separate channel protection from content trust.", "refs": ["phishing", "tls"]}, {"id": "net-mock-20261029-088", "topic": "threats", "type": "truefalse", "prompt": "Copying attacker-controlled input into a fixed-size buffer without checking its size can create a memory-corruption vulnerability.", "answer": true, "explanation": "Unchecked copying can overwrite memory beyond the intended buffer. The result can range from a crash to exploitable corruption, depending on the program and protections.", "objective": "Recognise unsafe memory handling.", "refs": ["memory"]}, {"id": "net-mock-20261029-089", "topic": "threats", "type": "short", "prompt": "An attacker silently reads unencrypted network traffic without changing its contents. Enter the conventional threat term.", "answer": ["Eavesdropping", "Passive eavesdropping", "Sniffing", "Packet sniffing"], "explanation": "Eavesdropping concerns unauthorised observation. Altering messages or impersonating an endpoint introduces additional attack behaviour.", "objective": "Identify passive confidentiality loss.", "refs": ["tls"]}, {"id": "net-mock-20261029-090", "topic": "threats", "type": "matching", "prompt": "Match each scenario to the closest threat. Use every option once.", "answer": [0, 1, 2, 3], "explanation": "These differ in the abused mechanism: session state, routing information, malformed packet handling and human deception. Historic malformed-packet attacks are not evidence that every modern stack is vulnerable.", "objective": "Differentiate attack mechanisms from scenarios.", "refs": ["ip", "icmp", "phishing"], "items": ["An attacker reuses a stolen authenticated session token", "An unauthorised route diverts traffic through a hostile path", "A crafted oversized/reassembled IP message crashes a vulnerable legacy stack", "A user is persuaded to enter credentials into a convincing fake form"], "options": ["Session hijacking", "Routing manipulation", "Ping-of-Death-style malformed-packet attack", "Phishing"]}, {"id": "net-mock-20261029-091", "topic": "controls", "type": "single", "prompt": "A sensor receives a copy of network traffic and alerts on suspicious activity, but cannot stop packets on the live path. Which role does it perform?", "answer": 2, "explanation": "A passive IDS observes and alerts. Inline prevention requires a deployment and enforcement capability that can affect traffic on the live path.", "objective": "Distinguish passive detection from inline prevention.", "refs": ["ids"], "options": ["Inline IPS enforcement", "Stateful firewall filtering", "Passive IDS monitoring", "Application traffic distribution"]}, {"id": "net-mock-20261029-092", "topic": "controls", "type": "single", "prompt": "A firewall policy needs application-aware inspection plus intrusion-prevention features. Which description best fits the intended capability?", "answer": 3, "explanation": "NGFW products commonly combine firewalling with deeper application inspection and prevention capabilities. Feature availability, licensing, placement and configuration still matter.", "objective": "Select a security platform by required capability.", "refs": ["firewall", "ids"], "options": ["A stateless packet filter limited to IP/port rules", "A router performing basic route selection only", "A passive packet capture sensor without enforcement", "A next-generation firewall with those features configured"]}, {"id": "net-mock-20261029-093", "topic": "controls", "type": "single", "prompt": "A normally quiet server suddenly sends unusually high outbound traffic. Which detection approach compares this behaviour with a baseline?", "answer": 0, "explanation": "Anomaly detection looks for deviations from expected behaviour. A deviation warrants investigation; it does not establish malicious intent on its own.", "objective": "Interpret baseline-based detection.", "refs": ["ids"], "options": ["Anomaly-based detection", "Signature matching for a known exploit byte pattern", "A fixed source-IP deny rule", "A static allowlist of destination service ports"]}, {"id": "net-mock-20261029-094", "topic": "controls", "type": "single", "prompt": "A critical security update is available for an exposed service. Which operational response best balances risk and service continuity?", "answer": 1, "explanation": "Patch management identifies applicable fixes, handles testing/deployment and verifies outcomes. Prioritisation should consider exposure and exploitation risk rather than treating updates as automatically harmless or unnecessary.", "objective": "Apply a managed patching workflow.", "refs": ["patch"], "options": ["Defer it until the service fails, then decide whether it applied", "Assess applicability, test appropriately, deploy promptly and verify the update", "Treat the perimeter firewall as sufficient mitigation without reviewing exposure", "Install it widely without checking compatibility or successful deployment"]}, {"id": "net-mock-20261029-095", "topic": "controls", "type": "multiple", "prompt": "Select TWO decisions consistent with Zero Trust principles.", "answer": [1, 3], "explanation": "Zero Trust does not grant implicit trust based only on network location. Access decisions and least privilege focus on protecting resources and authorised use.", "objective": "Apply context-based least-privilege access.", "refs": ["zt"], "options": ["Trust a device permanently because it is on campus Wi-Fi", "Evaluate identity, device and access context for resource access", "Grant every internal user broad access automatically", "Limit access to what is required for the authorised task"], "select": 2}, {"id": "net-mock-20261029-096", "topic": "controls", "type": "multiple", "prompt": "Select TWO properties that correctly configured TLS is designed to support for application communications.", "answer": [0, 2], "explanation": "TLS protects a communication channel, including confidentiality and integrity. Endpoint compromise or dishonest application content requires other controls.", "objective": "State the security properties and limits of TLS.", "refs": ["tls"], "options": ["Confidentiality of protected application data in transit", "Automatic repair of every compromised endpoint", "Detection of tampering with protected records", "Proof that every webpage gives honest advice"], "select": 2}, {"id": "net-mock-20261029-097", "topic": "controls", "type": "truefalse", "prompt": "A signature-based detector can miss a new attack if it has no matching signature or other detection logic.", "answer": true, "explanation": "Signatures identify known patterns. Coverage depends on the rule set and visibility; complementary detection and review can address some gaps.", "objective": "Explain signature coverage limits.", "refs": ["ids"]}, {"id": "net-mock-20261029-098", "topic": "controls", "type": "short", "prompt": "A current wireless deployment offers WPA2 and a newer WPA-family security generation. Enter the newer generation named WPA followed by its number.", "answer": ["WPA3", "WPA 3", "WPA-3"], "explanation": "WPA3 is the newer generation relative to WPA2. Choose a supported secure mode and appropriate authentication; a label alone does not validate the whole deployment.", "objective": "Distinguish WPA generations without assuming automatic protection.", "refs": ["wpa3"]}, {"id": "net-mock-20261029-099", "topic": "controls", "type": "short", "prompt": "A policy blocks every flow unless an explicit rule permits it. Enter the common two-word policy name.", "answer": ["Default deny", "Default-deny", "Deny by default"], "explanation": "Default deny starts from no implicit permission. Required flows need explicit, reviewed allow rules and testing so security and necessary service both work.", "objective": "Name an explicit-allow policy baseline.", "refs": ["firewall"]}, {"id": "net-mock-20261029-100", "topic": "controls", "type": "matching", "prompt": "Match each security validation result to its interpretation. Use every option once.", "answer": [0, 1, 2, 3], "explanation": "Test both permitted and prohibited behaviours. Alerts require context, encryption has a defined scope, and policy needs maintenance as services change.", "objective": "Interpret control testing and residual gaps.", "refs": ["firewall", "ids", "tls"], "items": ["An authorised flow works and a prohibited guest flow is blocked", "An IDS alert fires during a known benign backup", "HTTPS is enabled but stolen credentials still log in", "A rule set is reviewed after a new service is added"], "options": ["Evidence for the tested access rule", "Potential false positive requiring review", "Channel encryption does not replace credential protection", "Change-aware policy maintenance"]}]}</script><script>
const normalise = value => String(value ?? '').normalize('NFKC').toLowerCase().trim().replace(/[.,;:!?]+$/g,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
function complete(q,a){
 if(q.type==='short')return typeof a==='string'&&a.trim().length>0;
 if(q.type==='single')return Number.isInteger(a)&&a>=0&&a<q.options.length;
 if(q.type==='truefalse')return typeof a==='boolean';
 if(q.type==='multiple')return Array.isArray(a)&&a.length===q.select&&new Set(a).size===a.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<q.options.length);
 return Array.isArray(a)&&a.length===q.answer.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<q.answer.length)&&new Set(a).size===a.length;
}
function grade(q,a){
 if(!complete(q,a))return false;
 if(q.type==='short')return q.answer.some(v=>normalise(v)===normalise(a));
 if(q.type==='multiple')return [...a].sort((x,y)=>x-y).join(',')===[...q.answer].sort((x,y)=>x-y).join(',');
 if(Array.isArray(q.answer))return q.answer.every((v,i)=>v===a[i]);
 return q.answer===a;
}
function assess(exam,ids,answers){
 const selected=ids.map(id=>exam.questions.find(q=>q.id===id));
 if(selected.some(q=>!q)||new Set(ids).size!==ids.length)throw Error('Invalid question selection');
 const results=selected.map(q=>({id:q.id,topic:q.topic,correct:grade(q,answers[q.id]),answered:complete(q,answers[q.id])}));
 const topics=Object.entries(exam.topics).map(([id,t])=>{
  const rows=results.filter(r=>r.topic===id);return {id,name:t.name,total:rows.length,correct:rows.filter(r=>r.correct).length,missed:rows.filter(r=>!r.correct).map(r=>r.id)};
 }).filter(t=>t.total).sort((a,b)=>a.correct/a.total-b.correct/b.total||b.missed.length-a.missed.length);
 return {score:results.filter(r=>r.correct).length,total:results.length,unanswered:results.filter(r=>!r.answered).length,missed:results.filter(r=>!r.correct).map(r=>r.id),results,topics};
}
function validateExam(exam){
 if(exam?.schemaVersion!==1||typeof exam.id!=='string'||typeof exam.version!=='string'||typeof exam.title!=='string'||typeof exam.description!=='string'||typeof exam.scoring?.rule!=='string'||!exam.topics||!exam.sources||!Array.isArray(exam.questions)||!exam.questions.length||exam.questions.length>300)throw Error('Unsupported exam file');
 for(const t of Object.values(exam.topics))if(typeof t.name!=='string'||typeof t.revise!=='string'||typeof t.check!=='string')throw Error('Invalid topic feedback');
 for(const s of Object.values(exam.sources))if(!Array.isArray(s)||typeof s[0]!=='string'||typeof s[1]!=='string'||!/^https:\/\//.test(s[1]))throw Error('Invalid reference');
 const ids=new Set(),objectives=new Set(),prompts=new Set();
 for(const q of exam.questions){
  if(!q.id||ids.has(q.id)||!q.objective||objectives.has(normalise(q.objective))||!q.prompt||prompts.has(normalise(q.prompt))||!exam.topics[q.topic]||!q.explanation||!q.refs?.length||q.refs.some(r=>!exam.sources[r]))throw Error('Incomplete or repeated question: '+q.id);
  ids.add(q.id);objectives.add(normalise(q.objective));prompts.add(normalise(q.prompt));
  if(!['single','multiple','truefalse','short','matching','ordering'].includes(q.type))throw Error('Unknown question format');
  if(['single','multiple','matching'].includes(q.type)&&(!Array.isArray(q.options)||new Set(q.options).size!==q.options.length||q.options.length<2))throw Error('Invalid options');
  if(q.type==='short'&&(!Array.isArray(q.answer)||!q.answer.length||q.answer.some(x=>typeof x!=='string'||!x.trim())))throw Error('Invalid accepted answers');
  if(q.type==='matching'&&q.items?.length!==q.options?.length)throw Error('Invalid matching set');
  if(['matching','ordering'].includes(q.type)&&(!Array.isArray(q.items)||new Set(q.items).size!==q.items.length))throw Error('Repeated or missing task item');
  if(q.type==='ordering'&&q.items?.length!==q.answer?.length)throw Error('Invalid sequence');
  if(!grade(q,q.type==='short'?q.answer[0]:q.answer))throw Error('Invalid answer key: '+q.id);
 }
 return exam;
}
function shuffle(items,rng=Math.random){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function answerLabel(q,a){
 if(a===undefined||a===null||a===''||(Array.isArray(a)&&!a.length))return 'Unanswered';
 if(q.type==='short')return String(a);
 if(q.type==='single')return q.options[a]??'Unanswered';
 if(q.type==='truefalse')return a===true?'True':a===false?'False':'Unanswered';
 if(q.type==='multiple')return a.map(x=>q.options[x]??'Unanswered').join('; ');
 if(q.type==='matching')return q.items.map((v,i)=>v+' → '+(q.options[a[i]]??'Unanswered')).join(' • ');
 return a.map((v,i)=>(i+1)+'. '+(q.items[v]??'Unanswered')).join(' → ');
}
function keyLabel(q){return answerLabel(q,q.type==='short'?q.answer[0]:q.answer)}

let exam=validateExam(JSON.parse(document.querySelector('#exam-data').textContent));
const main=document.querySelector('main'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null,history=[],storageOK=true,reviewMode='missed';
let storageKey='uniquiz-mock-v1:'+exam.id;
const typeNames={single:'Choose one',multiple:'Select two',truefalse:'True or false',short:'Short answer',matching:'Matching',ordering:'Ordering'};
function loadSaved(){state=null;history=[];try{const s=JSON.parse(localStorage.getItem(storageKey)||'null');if(s?.version===exam.version){history=Array.isArray(s.history)?s.history.slice(-10):[];if(s.state&&Array.isArray(s.state.ids)&&s.state.ids.length&&s.state.ids.every(id=>exam.questions.some(q=>q.id===id))&&new Set(s.state.ids).size===s.state.ids.length&&s.state.answers&&s.state.display&&Number.isInteger(s.state.index)){state=s.state;state.index=Math.max(0,Math.min(state.index,state.ids.length-1));state.flags=Array.isArray(state.flags)?state.flags:[];}}}catch{storageOK=false}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({version:exam.version,state,history}));return true}catch{storageOK=false;document.querySelector('#save-status').textContent='Saving is unavailable. Keep this page open; you can still finish and download your result.';return false}}
function draw(html){main.innerHTML=html;main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});document.querySelector('#save-status').textContent=storageOK?'Answers stay in this browser. No account needed.':'Saving is unavailable; keep this page open to retain this attempt.'}
function download(name,data,type='application/json'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resources(t){const topic=exam.topics[t],v=topic.video;const url=v&&/^[-\w]{11}$/.test(v.id)?`https://www.youtube.com/watch?v=${v.id}&t=${Number.isInteger(v.start)?v.start:0}s`:null;return url?`<p><a href="${url}" target="_blank" rel="noopener noreferrer">Related lesson on YouTube</a><br><small>${esc(v.title)} · ${esc(v.channel)}. Use the written checklist for the complete topic.</small></p>`:''}
function intro(){
 const counts={};exam.questions.forEach(q=>counts[q.type]=(counts[q.type]||0)+1);
 draw(`<section class="hero"><span class="eyebrow">UniQuiz · independent practice</span><h1>${esc(exam.title)}</h1><p>${esc(exam.description)}</p><div class="pills"><span class="pill">${exam.questions.length} distinct questions</span><span class="pill">${exam.questions.length} available marks</span><span class="pill">6 question formats</span><span class="pill">Untimed</span></div></section><section class="panel"><h2>Take the mock</h2><p>Work through one question at a time. Skip, return or flag questions before you submit. Your draft saves automatically where browser storage is available. Explanations and revision advice appear after marking.</p><p><strong>Marking:</strong> ${esc(exam.scoring.rule)}</p><p class="muted">These are the practice rules for this mock. They do not establish the timing, marking or pass threshold of your university assessment.</p><div class="actions">${state?`<button class="primary" id="resume">${state.finished?'View saved result':'Resume saved attempt'}</button>`:''}<button ${state?'class="secondary"':'class="primary"'} id="new">Start a fresh full mock</button></div><div id="replace"></div></section><div class="grid"><section class="panel"><h2>What you will practise</h2><ul>${Object.values(exam.topics).map(t=>`<li>${esc(t.name)}</li>`).join('')}</ul></section><section class="panel"><h2>Question mix</h2><ul>${Object.entries(counts).map(([t,n])=>`<li>${n} ${esc(typeNames[t].toLowerCase())} questions</li>`).join('')}</ul><p>Each item tests a distinct objective. Matching and ordering use labelled menus so you can complete them with a keyboard or touch screen.</p></section></div>${history.length?`<section class="panel"><h2>Recent attempts in this browser</h2><ul>${history.slice().reverse().map(h=>`<li>${esc(new Date(h.at).toLocaleString())} · ${esc(h.mode)} · ${h.score}/${h.total}</li>`).join('')}</ul><p class="small">Up to ten completed attempts are kept. Results are local to this browser and do not sync between devices.</p></section>`:''}<details class="panel"><summary>Files and authoring</summary><p>This downloadable JSON includes answer keys and explanations. It uses the UniQuiz mixed-format schema included with this runner. It is separate from the existing MCQ bank.</p><div class="actions"><button id="export-bank">Download exam JSON (includes answers)</button><label class="button" for="import-bank">Import compatible exam JSON</label><input class="visually-hidden" id="import-bank" type="file" accept=".json,application/json"></div><p id="import-status" role="status"></p></details>`);
 document.querySelector('#new').onclick=()=>{if(state&&!state.finished){document.querySelector('#replace').innerHTML='<p class="notice">Starting fresh replaces the unfinished mock draft in this browser. Completed attempt summaries remain.</p><button class="danger" id="replace-confirm">Replace draft and start</button>';document.querySelector('#replace-confirm').onclick=()=>start(exam.questions.map(q=>q.id),'Full mock')}else start(exam.questions.map(q=>q.id),'Full mock')};
 if(state)document.querySelector('#resume').onclick=()=>state.finished?results():question();
 document.querySelector('#export-bank').onclick=()=>download('networking-mock-100.json',JSON.stringify(exam,null,2));
 document.querySelector('#import-bank').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error('File is too large');const candidate=validateExam(JSON.parse(await file.text()));if(state&&!state.finished){document.querySelector('#import-status').textContent='Finish the current attempt before importing another exam.';return}exam=candidate;storageKey='uniquiz-mock-v1:'+exam.id;loadSaved();intro()}catch{document.querySelector('#import-status').textContent='This is not a valid UniQuiz mixed-format exam file. Your current exam is unchanged.'}};
}
function start(ids,mode){state={ids:shuffle(ids),mode,index:0,answers:{},flags:[],display:{},finished:false,started:Date.now()};for(const id of ids){const q=exam.questions.find(q=>q.id===id);state.display[id]=shuffle((q.type==='ordering'?q.items:q.options||[]).map((_,i)=>i));}save();question()}
function optionOrder(q){const o=state.display[q.id],n=(q.type==='ordering'?q.items:q.options||[]).length;return Array.isArray(o)&&o.length===n&&new Set(o).size===n?o:Array.from({length:n},(_,i)=>i)}
function answeredCount(){return state.ids.filter(id=>complete(exam.questions.find(q=>q.id===id),state.answers[id])).length}
function question(){
 if(!state||state.finished)return intro();
 const q=exam.questions.find(q=>q.id===state.ids[state.index]),a=state.answers[q.id],done=answeredCount(),order=optionOrder(q);let controls='';
 if(q.type==='single'||q.type==='multiple')controls=`<fieldset><legend>${q.type==='multiple'?`Select exactly ${q.select} answers.`:'Choose one answer.'}</legend><div class="answers">${order.map(i=>`<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="choice" value="${i}" ${q.type==='single'?(a===i?'checked':''):(Array.isArray(a)&&a.includes(i)?'checked':'')}><span>${esc(q.options[i])}</span></label>`).join('')}</div></fieldset>`;
 if(q.type==='truefalse')controls=`<fieldset><legend>Choose True or False.</legend><div class="answers">${[true,false].map(v=>`<label class="option"><input type="radio" name="choice" value="${v}" ${a===v?'checked':''}><span>${v?'True':'False'}</span></label>`).join('')}</div></fieldset>`;
 if(q.type==='short')controls=`<label for="short-answer"><strong>Your answer</strong></label><p class="small">Case and extra spacing are ignored. Standard equivalent terms listed in the key are accepted; write the requested term or number.</p><input id="short-answer" type="text" autocomplete="off" maxlength="200" value="${esc(a||'')}">`;
 if(q.type==='matching'||q.type==='ordering')controls=`<p>${q.type==='matching'?'Choose one match for each row. Use every option once.':'Choose the item for each position, from first to last. Use each item once.'}</p>${q.items.map((item,i)=>`<div class="pair"><label for="part-${i}">${q.type==='matching'?esc(item):`Position ${i+1}`}</label><select id="part-${i}" data-part="${i}"><option value="">Choose…</option>${order.map(j=>`<option value="${j}" ${Array.isArray(a)&&a[i]===j?'selected':''}>${esc(q.type==='matching'?q.options[j]:q.items[j])}</option>`).join('')}</select></div>`).join('')}`;
 draw(`<div class="topline"><span>${esc(state.mode)} · ${state.index+1} of ${state.ids.length}</span><button id="home">Save and leave</button></div><div class="track" aria-label="${done} of ${state.ids.length} answered"><span style="width:${done/state.ids.length*100}%"></span></div><div class="exam-layout"><section class="panel question"><div class="topline"><span class="eyebrow">${esc(typeNames[q.type])} · 1 mark</span><span class="muted">${esc(exam.topics[q.topic].name)}</span></div><h1>${esc(q.prompt)}</h1>${controls}<p id="part-status" class="inline-status" role="status"></p><div class="actions"><button id="previous" ${state.index===0?'disabled':''}>Previous</button><button class="primary" id="next">${state.index===state.ids.length-1?'Review submission':'Save and next'}</button><button id="flag" aria-pressed="${state.flags.includes(q.id)}">${state.flags.includes(q.id)?'Remove flag':'Flag for review'}</button><button id="clear">Clear answer</button></div><p class="small" style="margin-top:18px">No answers or explanations are shown until you submit.</p></section><aside class="panel nav-panel"><h2>Question navigator</h2><p id="count">${done} / ${state.ids.length} answered</p><p class="small">Blue = answered · dot = flagged. Repeated choices in a matching/ordering set count as incomplete.</p><details><summary>Jump to a question</summary><div class="number-grid">${state.ids.map((id,i)=>`<button class="${i===state.index?'current ':''}${complete(exam.questions.find(q=>q.id===id),state.answers[id])?'done ':''}${state.flags.includes(id)?'flagged':''}" data-jump="${i}" aria-label="Question ${i+1}${state.flags.includes(id)?', flagged':''}" ${i===state.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div></details><button id="submit-review">Review submission</button></aside></div>`);
 function update(){save();const count=answeredCount();document.querySelector('#count').textContent=`${count} / ${state.ids.length} answered`;document.querySelector('.track span').style.width=(count/state.ids.length*100)+'%';document.querySelector('.track').setAttribute('aria-label',`${count} of ${state.ids.length} answered`);const nav=document.querySelector(`[data-jump="${state.index}"]`);nav.classList.toggle('done',complete(q,state.answers[q.id]));const ans=state.answers[q.id];document.querySelector('#part-status').textContent=q.type==='multiple'&&Array.isArray(ans)&&ans.length!==q.select?`Selected ${ans.length}; choose exactly ${q.select}.`:(['matching','ordering'].includes(q.type)&&Array.isArray(ans)&&ans.filter(Number.isInteger).length!==new Set(ans.filter(Number.isInteger)).size?'Use every option once; a selection is repeated.':'')}
 document.querySelectorAll('input[name=choice]').forEach(el=>el.onchange=()=>{state.answers[q.id]=q.type==='single'?Number(el.value):q.type==='truefalse'?el.value==='true':[...document.querySelectorAll('input[name=choice]:checked')].map(x=>Number(x.value));update()});
 if(q.type==='short')document.querySelector('#short-answer').oninput=e=>{state.answers[q.id]=e.target.value;update()};
 document.querySelectorAll('[data-part]').forEach(el=>el.onchange=()=>{const arr=Array.isArray(state.answers[q.id])?[...state.answers[q.id]]:Array(q.items.length).fill(null);arr[Number(el.dataset.part)]=el.value===''?null:Number(el.value);state.answers[q.id]=arr;update()});
 document.querySelector('#previous').onclick=()=>{state.index--;save();question()};document.querySelector('#next').onclick=()=>{if(state.index===state.ids.length-1)submission();else{state.index++;save();question()}};
 document.querySelector('#home').onclick=()=>{save();intro()};document.querySelector('#submit-review').onclick=submission;
 document.querySelector('#flag').onclick=()=>{state.flags=state.flags.includes(q.id)?state.flags.filter(id=>id!==q.id):[...state.flags,q.id];save();question()};
 document.querySelector('#clear').onclick=()=>{delete state.answers[q.id];save();question()};document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{state.index=Number(el.dataset.jump);save();question()});
}
function submission(){const missing=state.ids.filter(id=>!complete(exam.questions.find(q=>q.id===id),state.answers[id]));draw(`<section class="panel"><span class="eyebrow">Before marking</span><h1>Ready to submit?</h1><p><strong>${answeredCount()} of ${state.ids.length} questions have complete answers.</strong> ${state.flags.length} flagged for review.</p>${missing.length?`<p class="notice">${missing.length} unanswered or incomplete questions will score zero. Select-two requires exactly two choices; matching and ordering require each option once.</p>`:'<p class="good">Every question has a complete answer.</p>'}<p>${esc(exam.scoring.rule)} Your attempt is locked once marked. You can then retake the exam or practise mistakes.</p><div class="actions"><button id="return">Return to questions</button>${missing.length?'<button id="first-missing">Go to first incomplete</button>':''}<button class="primary" id="finish">Finish and mark ${state.ids.length} questions</button></div></section>`);document.querySelector('#return').onclick=question;if(missing.length)document.querySelector('#first-missing').onclick=()=>{state.index=state.ids.indexOf(missing[0]);save();question()};document.querySelector('#finish').onclick=()=>{if(state.finished)return;state.finished=true;state.finishedAt=Date.now();const r=assess(exam,state.ids,state.answers);history.push({at:new Date().toISOString(),mode:state.mode,score:r.score,total:r.total});history=history.slice(-10);save();reviewMode='missed';results()}}
function results(){const r=assess(exam,state.ids,state.answers);draw(`<section class="hero"><span class="eyebrow">${esc(state.mode)} · marked</span><h1>Your results and next steps</h1><div class="stats">${r.score}<span> / ${r.total}</span></div><p>${Math.round(r.score/r.total*100)}% correct · ${r.missed.length} questions to revisit · ${r.unanswered} unanswered or incomplete.</p><p class="muted">Practice score only. There is no official pass threshold assigned to this independent mock.</p><div class="actions"><button class="primary" id="retake">Retake all ${exam.questions.length}</button><button id="retry" ${r.missed.length?'':'disabled'}>Practise ${r.missed.length} mistakes</button><button id="export-result">Download my result</button><button id="home">Exam home</button></div></section><section><h2>Your revision priorities</h2><p>${r.missed.length?'Topics with the lowest accuracy appear first. Read the explanation for each missed objective, revise it, then try it again without the key.':'Every question in this attempt is correct. Use a fresh full attempt later to check retention.'}</p><div class="grid">${r.topics.map(t=>`<article class="topic"><span class="eyebrow">${t.missed.length?(t.correct/t.total<.6?'Revise first':t.correct/t.total<.8?'Practise next':'Consolidate'):'Secure in this attempt'}</span><h3>${esc(t.name)} · ${t.correct}/${t.total}</h3><p>${esc(t.missed.length?exam.topics[t.id].revise:'Keep this area active with spaced retrieval; one attempt does not prove lasting mastery.')}</p>${t.missed.length?`<p><strong>Checkpoint:</strong> ${esc(exam.topics[t.id].check)}</p>${resources(t.id)}`:''}</article>`).join('')}</div></section><section style="margin-top:30px"><h2>Question review</h2><label for="review-filter">Show </label><select id="review-filter"><option value="missed" ${reviewMode==='missed'?'selected':''}>Mistakes and incomplete answers</option><option value="all" ${reviewMode==='all'?'selected':''}>All questions and explanations</option></select><div id="reviews"></div></section>`);
 document.querySelector('#retake').onclick=()=>start(exam.questions.map(q=>q.id),'Full mock');document.querySelector('#retry').onclick=()=>start(r.missed,'Mistakes practice');document.querySelector('#home').onclick=intro;
 document.querySelector('#export-result').onclick=()=>download('networking-mock-result.json',JSON.stringify({examId:exam.id,version:exam.version,completed:new Date(state.finishedAt).toISOString(),mode:state.mode,...r,answers:state.answers},null,2));document.querySelector('#review-filter').onchange=e=>{reviewMode=e.target.value;reviews(r)};reviews(r)}
function reviews(r){const items=r.results.filter(x=>reviewMode==='all'||!x.correct);document.querySelector('#reviews').innerHTML=items.length?items.map(row=>{const q=exam.questions.find(q=>q.id===row.id);return `<article class="review-item"><span class="eyebrow">Question ${state.ids.indexOf(q.id)+1} · ${row.correct?'Correct':'Review needed'} · ${esc(exam.topics[q.topic].name)}</span><h3>${esc(q.prompt)}</h3><p class="review-answer"><strong>Your answer:</strong> ${esc(answerLabel(q,state.answers[q.id]))}</p><p class="review-answer"><strong>Correct answer:</strong> ${esc(keyLabel(q))}</p>${q.type==='short'?`<details><summary>Accepted equivalents</summary><p>${q.answer.map(esc).join('; ')}</p></details>`:''}<p>${esc(q.explanation)}</p><p class="small"><strong>Revise:</strong> ${esc(q.objective)}</p><div class="source-links">${q.refs.map(id=>{const s=exam.sources[id];return /^https:\/\//.test(s[1])?`<a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a>`:''}).join('')}</div></article>`}).join(''):'<p class="good">No mistakes to show in this attempt. Choose “All questions and explanations” to review the complete answer key.</p>'}
loadSaved();intro();

</script></body></html>
