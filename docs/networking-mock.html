number-grid .flagged:after{content:'•';position:absolute;right:4px;top:-4px;color:#a05200;font-size:18px}.nav-panel{margin:0;padding:17px}details{margin:16px 0}summary{cursor:pointer;font-weight:650;min-height:42px}details .number-grid{margin-top:12px}.track{height:8px;background:#e4eaf5;border-radius:6px;overflow:hidden;margin:18px 0}.track span{display:block;height:100%;background:var(--blue)}.notice{border-left:4px solid #b2780a;background:#fff4db;padding:14px 18px;border-radius:0 8px 8px 0}.good{border-left:4px solid #2a8059;background:#eaf6ef;padding:16px;border-radius:0 8px 8px 0}.bad{border-left:4px solid #b34330;background:#fff1eb;padding:16px;border-radius:0 8px 8px 0}.topic{padding:20px;border:1px solid var(--line);background:white;border-radius:12px}.topic h3{margin:0 0 8px}.topic p:last-child{margin-bottom:0}.review-item{padding:23px;background:white;border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow-wrap:anywhere}.review-item h3{margin-top:4px}.review-answer{padding:11px 14px;background:#eef2f9;border-radius:8px;white-space:pre-wrap}.source-links{font-size:13px;display:flex;flex-wrap:wrap;gap:12px}.small{font-size:13px}.inline-status{color:#77500b;margin:8px 0}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.skip{position:absolute;top:-70px;left:10px;background:white;padding:10px;z-index:10}.skip:focus{top:10px}.footer{max-width:1100px;margin:auto;padding:20px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}ul{padding-left:22px}li{margin-bottom:8px}[hidden]{display:none!important}@media(max-width:760px){.exam-layout{display:flex;flex-direction:column}.question,.nav-panel{width:100%}.nav-panel .number-grid{grid-template-columns:repeat(10,1fr)}.grid{grid-template-columns:1fr}.pair{grid-template-columns:1fr;gap:6px}.bar{padding:15px 18px}header span{max-width:45%;text-align:right;font-size:12px}main{padding:25px 16px 40px}.panel{padding:20px}.actions>*{flex:1 1 auto}.num </style></head><body><a class="skip" href="#main">Skip to exam</a><header><div class="bar"><a class="brand" href="https://uniquiz.cc/"><b>UQ</b>UniQuiz</a><span>Computer Networking · Original mock</span></div></header><main id="main" tabindex="-1"></main><noscript><p>Enable JavaScript to use interactive marking, or read the accompanying question paper and answer key.</p></noscript><footer class="footer"><span id="save-status" role="status" aria-live="polite"></span><br>Original mock streamlined · v2.0.0 · 29 October 2026</footer><script id="exam-data" type="application/json">{"schemaVersion": 1, "id": "uniquiz-cccu-original-mock-deduplicated", "version": "2.0.0", "title": "Computer Networking: Original Mock, Streamlined", "created": "2026-10-29", "description": "The supplied CCCU mock with repeated questions removed: 65 retained original questions, in their original order. Original stems and visible multiple-choice options are preserved. 64 questions are scored; original Q32 is retained as an unscored discussion because its wording is ambiguous.", "scoring": {"maximum": 64, "pointsPerQuestion": 1, "partialCredit": false, "negativeCredit": false, "rule": "One point per fully correct scored question; no partial or negative marks. 64 available marks across 65 retained questions. Original Q32 is review-only. Equivalent defensible answers are accepted where the source wording is broad. These are practice rules, not the original platform marking scheme."}, "preserveOrder": true, "topics": {"models": {"name": "OSI and TCP/IP models", "revise": "Separate bits, frames, packets and transport data. Practise mapping the four TCP/IP layers to OSI, then explain encapsulation without assuming every protocol fits one rigid box.", "check": "Explain which information a switch, router and receiving application each examine.", "video": {"id": "AYgXr1dynKU", "start": 88, "title": "Understanding the OSI Model", "channel": "Professor Messer"}}, "transport": {"name": "Transport and communication", "revise": "Compare TCP and UDP using reliability, ordering, overhead, ports and application requirements. Distinguish flow control from congestion control and encryption from reliable delivery.", "check": "Choose a transport for a financial file and for replaceable live samples; justify each trade-off.", "video": {"id": "LkolbURrtTs", "start": 118, "title": "OSI Model: A Practical Perspective", "channel": "Practical Networking"}}, "services": {"name": "Application protocols and ports", "revise": "Build a compact service-to-purpose table for DNS, DHCP, NTP, HTTP(S), SMTP and SSH/SFTP. Keep mail relay separate from mail submission and retrieval.", "check": "Trace how a newly connected laptop obtains settings, resolves a name and opens a secure website.", "video": {"id": "E5bSumTAHZE", "start": 16, "title": "Network Protocols: ARP, FTP, SMTP, HTTP, TLS, DNS, DHCP", "channel": "Practical Networking"}}, "devices": {"name": "Devices and client/server roles", "revise": "Choose devices by the function required. Distinguish repeating, bridging, routing, filtering, proxying and balancing, and recognise that one appliance can combine roles.", "check": "Draw a request path through an access point, router, proxy and load balancer, explaining each role.", "video": {"id": "H7-NR3Q3BeI", "start": 39, "title": "Hub, Bridge, Switch, Router", "channel": "Practical Networking"}}, "lan": {"name": "LANs, topologies and Wi-Fi", "revise": "Compare topology failure behaviour, Ethernet versus Wi-Fi, shared radio capacity, broadcast domains and VLAN boundaries. Consider both coverage and user density.", "check": "Explain why adding access points needs a radio/capacity plan and why a VLAN alone is not an access policy.", "video": {"id": "tf66r-LSEZE", "start": 68, "title": "The Bus, Star, Ring, Mesh & Tree Network Topologies", "channel": "Tech Hub Academy"}}, "diagnostics": {"name": "IP addressing and troubleshooting", "revise": "Use addressing, gateway, DNS and translation evidence to localise faults. Know what ping, traceroute and packet capture can demonstrate, and where their evidence stops.", "check": "For a host that reaches an IP address but not a hostname, choose a targeted next test and explain why.", "video": {"id": "FTUV0t6JaDA", "start": 155, "title": "NAT Explained - Network Address Translation", "channel": "PowerCert Animated Videos"}}, "process": {"name": "Network design process", "revise": "Work from measurable requirements through analysis, logical design, physical design, validation and acceptance. Distinguish top-down, bottom-up and hybrid decisions.", "check": "Turn a vague request for a fast network into a measurable acceptance criterion and a relevant test.", "video": null}, "campus": {"name": "Campus hierarchy and resilience", "revise": "Separate access, distribution and core functions. Evaluate redundancy, capacity, failure domains, failover and growth using the whole path rather than a device count.", "check": "Identify shared power, links or providers that can defeat an apparently redundant design.", "video": null}, "threats": {"name": "Threats and vulnerability analysis", "revise": "Identify the mechanism and affected asset for floods, spoofing, poisoning, hijacking, injection, memory errors and social engineering. Do not label every outage an attack.", "check": "For each threat, state the evidence that distinguishes it from a configuration error and select one relevant control.", "video": null}, "controls": {"name": "Security controls and validation", "revise": "Distinguish IDS alerts from inline prevention, validate rules, combine controls, protect credentials and traffic, and apply identity-based access decisions.", "check": "Explain the limits of encryption, segmentation and monitoring individually, then combine them in a small security plan.", "video": null}}, "sources": {"tcp": ["TCP standard (RFC 9293)", "https://www.rfc-editor.org/rfc/rfc9293.html"], "udp": ["UDP specification (RFC 768)", "https://www.rfc-editor.org/rfc/rfc768.html"], "dns": ["DNS implementation (RFC 1035)", "https://www.rfc-editor.org/rfc/rfc1035.html"], "dhcp": ["DHCP (RFC 2131)", "https://www.rfc-editor.org/rfc/rfc2131.html"], "smtp": ["Mail submission versus relay (RFC 6409)", "https://www.rfc-editor.org/rfc/rfc6409.html"], "tls": ["TLS 1.3 (RFC 8446)", "https://www.rfc-editor.org/rfc/rfc8446.html"], "ports": ["IANA service and port registry", "https://www.iana.org/assignments/service-names-port-numbers/"], "campus": ["Cisco campus architecture", "https://www.cisco.com/c/en/us/td/docs/solutions/Enterprise/Campus/campover.html"], "ha": ["Cisco campus high availability", "https://www.cisco.com/c/en/us/td/docs/solutions/Enterprise/Campus/HA_campus_DG/hacampusdg.html"], "switch": ["Cisco: how a switch works", "https://www.cisco.com/site/us/en/learn/topics/small-business/network-switch-how.html"], "topology": ["Cisco network topology", "https://www-cloud.cisco.com/site/us/en/learn/topics/networking/what-is-network-topology.html"], "zt": ["NIST Zero Trust Architecture", "https://csrc.nist.gov/pubs/sp/800/207/final"], "ids": ["NIST intrusion detection and prevention guide", "https://csrc.nist.gov/pubs/sp/800/94/final"], "firewall": ["NIST firewall policy guide", "https://csrc.nist.gov/pubs/sp/800/41/r1/final"], "patch": ["NIST enterprise patch management", "https://csrc.nist.gov/pubs/sp/800/40/r4/final"], "ip": ["IPv4 (RFC 791)", "https://www.rfc-editor.org/rfc/rfc791.html"], "arp": ["ARP (RFC 826)", "https://www.rfc-editor.org/rfc/rfc826.html"], "icmp": ["ICMP (RFC 792)", "https://www.rfc-editor.org/rfc/rfc792.html"], "nat": ["Traditional NAT (RFC 3022)", "https://www.rfc-editor.org/rfc/rfc3022.html"], "private": ["Private IPv4 addressing (RFC 1918)", "https://www.rfc-editor.org/rfc/rfc1918.html"], "ssh": ["SSH architecture (RFC 4251)", "https://www.rfc-editor.org/rfc/rfc4251.html"], "ntp": ["NTPv4 (RFC 5905)", "https://www.rfc-editor.org/rfc/rfc5905.html"], "http": ["HTTP semantics (RFC 9110)", "https://www.rfc-editor.org/rfc/rfc9110.html"], "osi": ["Cisco: the seven-layer model", "https://www.cisco.com/c/en/us/td/docs/ios/sw_upgrades/interlink/r2_0/api_con/acoview.pdf"], "wlan": ["NIST wireless LAN security", "https://csrc.nist.gov/pubs/sp/800/153/final"], "owasp": ["OWASP injection guidance", "https://owasp.org/Top10/A03_2021-Injection/"], "phishing": ["CISA: recognise and report phishing", "https://www.cisa.gov/secure-our-world/recognize-and-report-phishing"], "ddos": ["CISA: understanding denial-of-service attacks", "https://www.cisa.gov/news-events/news/understanding-denial-service-attacks"], "memory": ["MITRE CWE-120: buffer copying without checking input size", "https://cwe.mitre.org/data/definitions/120.html"], "wifi-modern": ["HPE Aruba: Wi-Fi generations and security", "https://arubanetworking.hpe.com/techdocs/aos/wifi-design-deploy/generations/overview/"], "wpa3": ["Cisco WPA3 deployment guide", "https://www.cisco.com/c/en/us/products/collateral/wireless/catalyst-9100ax-access-points/wpa3-dep-guide-og.html"]}, "questions": [{"id": "cccu-mock-original-q001", "originalNumber": 1, "topic": "controls", "type": "single", "answer": 2, "explanation": "A next-generation firewall combines conventional traffic filtering with deeper inspection and often intrusion-prevention capabilities. These features still depend on deployment and configuration.", "objective": "NGFW capabilities.", "refs": ["firewall", "ids"], "prompt": "What is the role of next-generation firewalls (NGFW) in security architectures?", "options": ["Only block ports at the network layer", "Replace IDS entirely", "Combine traditional firewall features with deep packet inspection and IPS capabilities", "Encrypt all traffic automatically"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 1, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q002", "originalNumber": 2, "topic": "threats", "type": "single", "answer": 3, "explanation": "The scenario describes availability being deliberately exhausted by traffic. A distributed attack uses multiple sources; a DoS attack need not be distributed.", "objective": "Recognise a traffic-flood availability attack.", "refs": ["ddos"], "prompt": "Which of the following describes a scenario where critical services are unavailable due to deliberate traffic floods?", "options": ["Man-in-the-middle", "Phishing", "Data leakage", "Denial-of-Service (DoS) and Distributed DoS (DDoS) attacks"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 2, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q003", "originalNumber": 3, "topic": "threats", "type": "single", "answer": 1, "explanation": "DNS cache poisoning introduces false cached name-to-address information so users may reach an attacker-controlled destination. It is different from poisoning local ARP mappings.", "objective": "DNS cache poisoning.", "refs": ["dns"], "prompt": "DNS cache poisoning attacks aim to cause users to be redirected to attacker-controlled IP addresses. This is an example of which vulnerability category?", "options": ["IP spoofing", "DNS poisoning (cache poisoning)", "ARP poisoning", "Phishing"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 3, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q004", "originalNumber": 4, "topic": "controls", "type": "single", "answer": 1, "explanation": "Anomaly-based detection compares behaviour with an expected baseline. Unusual behaviour warrants investigation and is not itself proof of an attack.", "objective": "Anomaly-based monitoring.", "refs": ["ids"], "prompt": "Which monitoring approach helps detect and counter unusual traffic patterns indicating potential security incidents?", "options": ["Only physical access controls are needed", "Anomaly-based detection in IDS", "Signature-based detection only", "No monitoring required"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 4, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q005", "originalNumber": 5, "topic": "threats", "type": "single", "answer": 0, "explanation": "The intended historical example is Ping of Death: malformed or oversized/reassembled packets can exploit vulnerable packet handling. Not every ICMP flood or current network stack has this vulnerability.", "objective": "Malformed ICMP/IP packet handling attacks.", "refs": ["icmp", "ip"], "prompt": "What type of attack uses crafted ICMP messages to disrupt a service by exceeding packet handling capabilities?", "options": ["Ping of Death (ICMP-related)", "SYN flood", "DNS amplification", "SMB relay"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 5, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q006", "originalNumber": 6, "topic": "controls", "type": "single", "answer": 3, "explanation": "An IDS monitors for attack signatures or anomalous behaviour and produces alerts. Prevention requires an appropriate inline enforcement capability.", "objective": "Purpose of an IDS.", "refs": ["ids"], "prompt": "Which security tool type monitors network traffic for unusual patterns or known attack signatures?", "options": ["Load balancer", "Content delivery network", "VPN concentrator", "Intrusion Detection System (IDS)"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 6, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q008", "originalNumber": 8, "topic": "threats", "type": "single", "answer": 1, "explanation": "Forged IP source addresses and manipulation of routes affect Internet-layer addressing or forwarding. ARP and MAC attacks target local-link mechanisms.", "objective": "Internet-layer spoofing and routing attacks.", "refs": ["ip"], "prompt": "Which Internet-layer attacks involve spoofing of source addresses or routing manipulation?", "options": ["Blanket encryption", "IP spoofing and routing attacks", "MAC flooding", "ARP poisoning"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 8, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q009", "originalNumber": 9, "topic": "controls", "type": "single", "answer": 1, "explanation": "This is the best available original option: unpatched systems may retain known exploitable vulnerabilities that an applicable security patch addresses. Patches fix vulnerabilities rather than attackers' exploit programs.", "objective": "Risk from missing security patches.", "refs": ["patch"], "prompt": "Why are unpatched software vulnerabilities a continuing risk for organisations?", "options": ["Because patches are rarely available for popular software", "Because patches fix known exploits that attackers can use to compromise systems", "Because all software remains secure after updates", "Because patches slow down systems"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 9, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q010", "originalNumber": 10, "topic": "threats", "type": "single", "answer": 3, "explanation": "The only original option containing injection is the intended choice. Its grouping is imprecise: insufficient input validation is directly relevant to SQL/code injection, while phishing and malware distribution are not generally caused by input-validation flaws.", "objective": "Recognise the intended injection option and its wording limitation.", "refs": ["owasp"], "prompt": "In the TCP/IP application layer, which attacks are typically associated with insufficient input validation?", "options": ["SYN flooding", "ARP poisoning", "DNS spoofing", "Phishing, malware distribution, SQL/code injection"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 10, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q011", "originalNumber": 11, "topic": "threats", "type": "single", "answer": 2, "explanation": "SQL, NoSQL, OS-command and LDAP injection are recognised injection categories. The exact lecture list is not an official answer key; the broad listed option is technically appropriate.", "objective": "Distinguish several injection categories.", "refs": ["owasp"], "prompt": "Injection flaws in applications typically enable attackers to input malicious data to gain control. Which are the common types mentioned in the Network Security notes?", "options": ["LDAP injections only", "XML injections", "SQL, NoSQL, OS, and LDAP injections", "Code injections only"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 11, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q012", "originalNumber": 12, "topic": "threats", "type": "single", "answer": 3, "explanation": "Eavesdropping is unauthorised observation of communications. Unencrypted payloads can expose sensitive information to an observer with traffic access.", "objective": "Passive eavesdropping.", "refs": ["tls"], "prompt": "Which threat involves secretly listening to unencrypted communications to read sensitive data?", "options": ["Phishing", "Spoofing", "Buffer overflow", "Eavesdropping"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 12, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q013", "originalNumber": 13, "topic": "threats", "type": "single", "answer": 1, "explanation": "This is the intended original choice. SYN flooding consumes TCP setup resources, while session hijacking abuses session state. Session hijacking can also involve application-layer session tokens; the original layer classification is simplified.", "objective": "Recognise the intended connection/session attack grouping.", "refs": ["tcp", "ids"], "prompt": "Which transport-layer attack exploits lack of session security and can lead to disruption of connections?", "options": ["MAC flooding", "Session hijacking or SYN flooding", "IP spoofing", "DNS poisoning"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 13, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q014", "originalNumber": 14, "topic": "controls", "type": "single", "answer": 3, "explanation": "Improper authentication and weak credential handling can enable unauthorised access. Strong policies and correctly deployed authentication controls are protections, not examples of that weakness.", "objective": "Authentication and credential weaknesses.", "refs": ["zt"], "prompt": "Which authentication-related weakness is highlighted as a common Application Layer vulnerability?", "options": ["TLS mutual authentication", "Perfect forward secrecy", "Strong password policies implemented", "Improper authentication and weak credential handling"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 14, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q015", "originalNumber": 15, "topic": "threats", "type": "single", "answer": 0, "explanation": "A buffer overflow can overwrite memory outside an intended buffer. Depending on the defect and protections, consequences can include crashes or arbitrary code execution.", "objective": "Memory handling vulnerabilities.", "refs": ["memory"], "prompt": "Which vulnerability arises from improper memory handling that can allow attackers to execute arbitrary code on a target system?", "options": ["Buffer overflows", "DNS poisoning", "SQL injection", "Cross-site scripting (XSS)"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 15, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q016", "originalNumber": 16, "topic": "threats", "type": "single", "answer": 1, "explanation": "Social engineering manipulates people or processes into unsafe actions, such as disclosing credentials. It does not depend on overwhelming network hardware.", "objective": "Phishing and social engineering mechanisms.", "refs": ["phishing"], "prompt": "Phishing and social engineering primarily aim to compromise information by which means?", "options": ["Providing false software updates", "Tricking individuals into divulging confidential information", "Overloading network devices", "Exploiting hardware defects"], "optionProvenance": "Original complete options retained", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 16, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q017", "originalNumber": 17, "topic": "lan", "type": "short", "answer": ["Bus", "Bus topology"], "explanation": "A bus topology uses a shared linear communication backbone.", "objective": "Bus topology.", "refs": ["topology"], "prompt": "In LAN design, a _____ topology represents a linear structure where devices share a single communication line.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 17, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q018", "originalNumber": 18, "topic": "lan", "type": "short", "answer": ["Network", "Computer network", "LAN", "Local area network"], "explanation": "The wording is broad: network and LAN are both reasonable. The question does not specify enough geographical detail to insist on LAN alone, so both are accepted.", "objective": "Interpret the original broad network definition fairly.", "refs": ["switch"], "prompt": "A _____ is a collection of devices communicating over a shared medium within defined boundaries.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 18, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q020", "originalNumber": 20, "topic": "lan", "type": "short", "answer": ["Mesh", "Mesh topology", "Full mesh", "Full mesh topology", "Partial mesh", "Partial mesh topology"], "explanation": "A mesh provides alternate paths. Actual resilience also depends on forwarding, usable routes and shared failure dependencies.", "objective": "Mesh redundancy.", "refs": ["topology"], "prompt": "In LAN topology assessments, a _____ topology offers high redundancy and fault tolerance through multiple communication paths.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 20, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q021", "originalNumber": 21, "topic": "lan", "type": "blanks", "answer": ["2.4", "5"], "explanation": "The traditional intended pair is 2.4 GHz and 5 GHz. Newer supported Wi-Fi can also use 6 GHz where permitted, so any two distinct valid bands from this set are accepted.", "objective": "Common WLAN frequency bands.", "refs": ["wifi-modern"], "prompt": "Wi-Fi networks in LANs commonly use the IEEE 802.11 standards with operating frequencies in the _____ and _____ bands.", "fields": ["First band", "Second band"], "groups": [["2.4", "2.4 GHz", "2.4GHz", "2.4 gigahertz"], ["5", "5 GHz", "5GHz", "5 gigahertz"], ["6", "6 GHz", "6GHz", "6 gigahertz"]], "unordered": true, "minimumDistinct": 2, "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 21, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q022", "originalNumber": 22, "topic": "diagnostics", "type": "short", "answer": ["NAT", "Network Address Translation", "PAT", "Port Address Translation", "NAPT", "Network Address Port Translation"], "explanation": "NAT translates IP addresses. PAT/NAPT is the common shared-public-address form that also uses port translation, and is accepted as a more specific correct term.", "objective": "IPv4 translation.", "refs": ["nat"], "prompt": "The term _____ describes translating private IP addresses to public ones for Internet access within a LAN.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 22, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q023", "originalNumber": 23, "topic": "diagnostics", "type": "blanks", "answer": ["ping", "traceroute", "Wireshark"], "explanation": "The original is open-ended and does not name a mandatory trio. Any three distinct recognised tools in the accepted list score correctly; aliases such as tracert/traceroute count as one tool. ping, traceroute and Wireshark are examples, not the only acceptable answer.", "objective": "Select legitimate LAN diagnostic tools.", "refs": ["icmp", "dns"], "prompt": "Troubleshooting LANs commonly employs tools such as _____, _____, and _____.", "fields": ["Tool 1", "Tool 2", "Tool 3"], "groups": [["ping"], ["traceroute", "tracert"], ["Wireshark", "wireshark analyser", "wireshark analyzer"], ["tcpdump"], ["ipconfig"], ["ifconfig"], ["ip", "ip command", "iproute2"], ["nslookup"], ["dig"], ["netstat"], ["ss"], ["arp"], ["route"], ["iperf", "iperf3"], ["mtr"], ["pathping"], ["nmap"], ["tshark"], ["ethtool"], ["network analyser", "network analyzer", "packet analyser", "packet analyzer", "packet sniffer"]], "unordered": true, "minimumDistinct": 3, "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 23, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q024", "originalNumber": 24, "topic": "models", "type": "short", "answer": ["Internet", "Internet layer", "IP", "IP layer"], "explanation": "Internet is the conventional four-layer TCP/IP model name in this sequence. It corresponds most closely to OSI Network.", "objective": "Name the four-layer Internet layer.", "refs": ["ip", "osi"], "prompt": "TCP/IP is the foundation protocol suite for LANs and the Internet, implemented in a layered fashion with four layers: Application, Transport, _____, and Network Access.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 24, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q025", "originalNumber": 25, "topic": "lan", "type": "short", "answer": ["Star", "Star topology"], "explanation": "A star has separate links from stations to a central device. A failure of the central device remains a shared risk.", "objective": "Star topology.", "refs": ["topology"], "prompt": "A common LAN topology where all devices connect to a central hub or switch is the _____ topology.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 25, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q027", "originalNumber": 27, "topic": "controls", "type": "blanks", "answer": ["WPA2", "WPA3"], "explanation": "The modern recommended pair is WPA2 and WPA3, with secure supported modes. The source says such as, so two distinct named Wi-Fi security protocols are accepted; WPA and WEP are historical mechanisms and should not be selected for a new secure deployment.", "objective": "Recognise Wi-Fi security protocols and distinguish legacy insecurity.", "refs": ["wpa3", "wlan"], "prompt": "In wireless LANs, security protocols such as _____ and _____ are used to secure Wi-Fi networks.", "fields": ["Protocol 1", "Protocol 2"], "groups": [["WPA2", "WPA 2", "WPA-2", "Wi-Fi Protected Access 2", "WPA2-Personal", "WPA2-Enterprise"], ["WPA3", "WPA 3", "WPA-3", "Wi-Fi Protected Access 3", "WPA3-Personal", "WPA3-Enterprise"], ["WPA", "Wi-Fi Protected Access"], ["WEP", "Wired Equivalent Privacy"]], "unordered": true, "minimumDistinct": 2, "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 27, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q028", "originalNumber": 28, "topic": "lan", "type": "short", "answer": ["Wired", "Wired network", "Wired networking", "Wired LAN", "Wired Ethernet"], "explanation": "IEEE 802.3 is Ethernet; IEEE 802.11 concerns WLAN radio links.", "objective": "Ethernet versus wireless standards.", "refs": ["switch"], "prompt": "IEEE 802.3 is the Ethernet standard for _____ connections.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 28, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q029", "originalNumber": 29, "topic": "services", "type": "truefalse", "answer": true, "explanation": "DNS is an application-layer service. Address records map names to IP addresses, although DNS can hold other record types as well.", "objective": "DNS layer and principal addressing purpose.", "refs": ["dns"], "prompt": "DNS operates within the Application Layer and is primarily concerned with mapping domain names to IP addresses.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 29, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q030", "originalNumber": 30, "topic": "transport", "type": "truefalse", "answer": false, "explanation": "UDP is connectionless and does not itself guarantee reliable, ordered delivery. An application using it must provide any required recovery or ordering.", "objective": "UDP service properties.", "refs": ["udp"], "prompt": "UDP is connection-oriented and guarantees reliable ordered delivery of data.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 30, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q032", "originalNumber": 32, "topic": "models", "type": "truefalse", "answer": false, "explanation": "The statement is ambiguous without specifying a protocol or model convention. Routers can participate in network-layer congestion management, while TCP performs transport-layer congestion control. Assigning an unqualified True or False would be unfair, so this original item is retained for review and excluded from the score.", "objective": "Discuss congestion responsibilities across layers.", "refs": ["tcp", "ip"], "prompt": "Congestion control is a function of the Network Layer in OSI, managing how packets are moved across a congested network.", "scored": false, "reviewAnswer": "Context-dependent: network-layer congestion mechanisms and TCP transport-layer congestion control both exist.", "sourceIssue": "The original wording does not specify the congestion mechanism or model convention; this item is review-only.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 32, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q035", "originalNumber": 35, "topic": "models", "type": "truefalse", "answer": false, "explanation": "OSI is a reference model used to explain responsibilities and interfaces. Real implementations need not copy its seven layers exactly.", "objective": "Reference model versus mandatory implementation.", "refs": ["osi"], "prompt": "The OSI model is a practical implementation standard that must be implemented exactly as defined in all network hardware.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 35, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q036", "originalNumber": 36, "topic": "models", "type": "truefalse", "answer": true, "explanation": "The intended teaching answer is True: modularity allows a technology to change while preserving its service interface. In practice, changed interfaces, performance or assumptions can still affect other layers.", "objective": "Layer modularity with stable interfaces.", "refs": ["osi"], "prompt": "The OSI model’s modular design allows each layer to evolve independently without impacting other layers.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 36, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q037", "originalNumber": 37, "topic": "lan", "type": "truefalse", "answer": false, "explanation": "A VLAN primarily supplies Layer 2 logical separation. Routing and access-control policies can enforce communication boundaries between those VLANs at Layer 3 or above.", "objective": "VLAN layer classification.", "refs": ["campus", "firewall"], "prompt": "A VLAN is a concept that helps segment traffic and enforce security zones at the Network Layer.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 37, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q039", "originalNumber": 39, "topic": "models", "type": "truefalse", "answer": true, "explanation": "Link-layer framing and frame checks provide local-link organisation and error detection. Error detection does not imply that every link protocol performs reliable end-to-end recovery.", "objective": "Data Link framing and local error detection.", "refs": ["osi"], "prompt": "In the OSI model, the Data Link Layer is responsible for both error detection and framing of data on a local link.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 39, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q041", "originalNumber": 41, "topic": "models", "type": "matching", "answer": [0, 1, 2, 3], "explanation": "TCP transport provides stream recovery/flow control; IP handles inter-network delivery; link technologies frame local traffic; Physical transmits signals. These original selected labels form a complete technically correct response bank.", "objective": "Map lower-layer functions.", "refs": ["tcp", "ip", "osi"], "prompt": "Map the following OSI/TCP-IP concepts to their primary traffic handling function.", "items": ["Error recovery and flow control for data streams", "Packet routing across networks", "Framing and MAC addressing on local links", "Physical transmission over media"], "options": ["Transport Layer (TCP)", "Network Layer (IP)", "Data Link Layer (Ethernet/Wi-Fi)", "Physical Layer"], "reuseOptions": true, "optionProvenance": "All response labels visible in the PDF; the complete correct set can be recovered.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 41, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q042", "originalNumber": 42, "topic": "models", "type": "matching", "answer": [0, 1, 2, 3], "explanation": "The reference model supports scoped troubleshooting, modular interfaces and common terminology. Its application-layer role supplies services used by applications.", "objective": "OSI abstraction and troubleshooting benefits.", "refs": ["osi"], "prompt": "Match the following OSI layers to their primary role in troubleshooting and modular design.", "items": ["Troubleshooting scope limited to a specific layer", "Abstraction allowing independent evolution of technologies", "Standardisation across diverse hardware and software", "End-user service provision to applications"], "options": ["Layered troubleshooting (OSI)", "Modularity (OSI)", "Standardisation (OSI)", "Application Layer role (OSI)"], "reuseOptions": true, "optionProvenance": "All response labels visible in the PDF; the complete correct set can be recovered.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 42, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q043", "originalNumber": 43, "topic": "models", "type": "matching", "answer": [0, 1, 2, 4], "explanation": "The conventional OSI roles are Session, Presentation, Application and Physical respectively. Data Link handles frames rather than the physical movement of bits. The missing Physical response was restored; the question and its rows are unchanged.", "objective": "Map upper-layer roles and bit transmission.", "refs": ["osi"], "prompt": "Match the OSI model layers to their core responsibilities as described in Lecture 3.", "items": ["Layer that manages a session between applications", "Layer that handles data presentation and translation", "Layer that provides services to applications", "Layer that manages how bits are moved across a medium"], "options": ["Session Layer (Layer 5)", "Presentation Layer (Layer 6)", "Application Layer (Layer 7)", "Data Link Layer (Layer 2)", "Physical Layer (Layer 1)"], "reuseOptions": true, "optionProvenance": "Original visible response labels retained; the missing correct Physical label was restored because unselected dropdown options were not exported.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 43, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q044", "originalNumber": 44, "topic": "services", "type": "matching", "answer": [0, 1, 2, 4], "explanation": "Conventional HTTP, HTTPS and DNS service ports are 80, 443 and 53. Mail submission normally uses 587; 465 is accepted for implicit TLS submission. Port 25 is conventionally relay. The PDF does not show its full original dropdown bank, so missing correct submission responses have been restored.", "objective": "Associate common service ports without conflating submission and relay.", "refs": ["ports", "smtp", "dns"], "prompt": "Identify the correct set of port-number associations for common Application Layer protocols.", "items": ["HTTP web service port", "HTTPS secure web service port", "DNS name resolution port", "SMTP mail submission port"], "options": ["80", "443", "53", "23 (Telnet)", "587 (mail submission)", "465 (implicit TLS submission)", "25 (SMTP relay)"], "reuseOptions": true, "acceptedPerItem": [[0], [1], [2], [4, 5]], "optionProvenance": "80, 443, 53 and 23 (Telnet) are visible source labels; appropriate missing SMTP responses were restored.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 44, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q045", "originalNumber": 45, "topic": "services", "type": "matching", "answer": [1, 2, 3, 4], "explanation": "All four are application-layer services, even though DHCP supplies IP settings. The original PDF shows selected answers rather than the complete bank; three suitable application-service labels were restored. The misleading Network-layer choice remains an available distractor.", "objective": "Classify configuration, name, time and secure web services.", "refs": ["dhcp", "dns", "ntp", "http"], "prompt": "Match the role of the following protocol types in the lecture with their core function.", "items": ["DHCP server provides dynamic IP addresses", "DNS translates domain names to IP addresses", "NTP synchronises network time", "HTTPS provides secure web traffic"], "options": ["Network Layer/Internet Protocol management (address assignment context)", "Application/Host Configuration (DHCP)", "Application/Name Resolution (DNS)", "Application/Network Time Synchronisation", "Application/Secure Web Service (HTTPS)"], "reuseOptions": true, "optionProvenance": "Two original visible response labels retained; three missing correct application-service labels were restored.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 45, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q046", "originalNumber": 46, "topic": "models", "type": "matching", "answer": [0, 1, 2, 3], "explanation": "The four-layer model groups OSI Physical/Data Link into Network Interface and the three upper OSI layers into Application. Its Internet and Transport layers correspond most closely to OSI Network and Transport.", "objective": "Compare full OSI/TCP-IP groupings.", "refs": ["osi"], "prompt": "Match the following TCP/IP model layers to the OSI layers that most closely correspond, in the order of the four-layer model.", "items": ["TCP/IP Network Interface corresponds to OSI Physical + Data Link", "TCP/IP Internet Layer corresponds to OSI Network Layer", "TCP/IP Transport Layer corresponds to OSI Transport Layer", "TCP/IP Application Layer corresponds to OSI Application/Presentation/Session"], "options": ["OSI: Physical + Data Link", "OSI: Network Layer", "OSI: Transport Layer", "OSI: Application/Presentation/Session"], "reuseOptions": true, "optionProvenance": "All response labels visible in the PDF; the complete correct set can be recovered.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 46, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q051", "originalNumber": 51, "topic": "process", "type": "short", "answer": ["Hybrid approach", "Hybrid", "Hybrid design", "Hybrid design approach"], "explanation": "A hybrid approach combines requirements-led decisions with the realities of available technology and constraints.", "objective": "Hybrid design.", "refs": ["campus"], "prompt": "A design approach that blends Top-Down and Bottom-Up strategies is the _____.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 51, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q053", "originalNumber": 53, "topic": "process", "type": "truefalse", "answer": true, "explanation": "Top-down design starts with business/application needs and derives supporting technical requirements before choosing implementation details.", "objective": "Top-down starting point.", "refs": ["campus"], "prompt": "A top-down design approach begins with business requirements and derives network requirements from them.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 53, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q054", "originalNumber": 54, "topic": "process", "type": "truefalse", "answer": false, "explanation": "Logical design includes addressing, segmentation and communication relationships. Equipment, locations and physical links belong to physical implementation design.", "objective": "Logical versus physical design.", "refs": ["campus"], "prompt": "The primary aim of a logical design is to specify physical devices without regard to IP addressing.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 54, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q055", "originalNumber": 55, "topic": "process", "type": "truefalse", "answer": true, "explanation": "Both tools can support modelling or emulating network behaviour, with different feature coverage. A simulation is evidence for the features and conditions actually tested.", "objective": "Design simulation tools.", "refs": ["campus"], "prompt": "GNS3 and Packet Tracer are tools used to simulate network designs during the planning phase.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 55, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q056", "originalNumber": 56, "topic": "lan", "type": "truefalse", "answer": true, "explanation": "VLANs separate link-layer broadcast domains and can support security zoning and traffic organisation. Access policies still need enforcement; VLANs do not automatically guarantee security or balanced load.", "objective": "Purpose and limits of VLAN segmentation.", "refs": ["campus", "firewall"], "prompt": "VLAN segmentation is a technique used to improve security and improve load management in a campus network.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 56, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q057", "originalNumber": 57, "topic": "lan", "type": "truefalse", "answer": true, "explanation": "A wireless plan must consider coverage and concurrent demand. A room can have strong signal but insufficient shared radio capacity for its user density.", "objective": "Wireless coverage and density planning.", "refs": ["wlan"], "prompt": "Wireless access point placement should consider Wi-Fi coverage mapping and user density.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 57, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q058", "originalNumber": 58, "topic": "campus", "type": "truefalse", "answer": true, "explanation": "In a traditional three-tier campus, distribution aggregates access traffic and is a common routing/policy boundary. Some real architectures distribute functions differently.", "objective": "Distribution aggregation and policy.", "refs": ["campus"], "prompt": "The distribution layer is responsible for routing policy enforcement and aggregation of access layer traffic.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 58, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q061", "originalNumber": 61, "topic": "campus", "type": "truefalse", "answer": false, "explanation": "Hierarchy supports performance, scalability, manageability and availability. Cost is a constraint and trade-off, not the sole or primary definition of the model.", "objective": "Purposes of hierarchical design.", "refs": ["campus"], "prompt": "The three layers of hierarchical design (Core, Distribution, Access) are primarily concerned with cost minimisation rather than performance.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 61, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q062", "originalNumber": 62, "topic": "campus", "type": "truefalse", "answer": false, "explanation": "Failover can maintain availability by switching to a working backup when a primary path fails. Recovery time and shared dependencies determine its effectiveness.", "objective": "Failover relevance.", "refs": ["ha"], "prompt": "A failover routing strategy is not relevant to availability in network design.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 62, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q063", "originalNumber": 63, "topic": "process", "type": "truefalse", "answer": true, "explanation": "Bottom-up design starts from available technologies or infrastructure and considers how to meet goals with those resources.", "objective": "Bottom-up starting point.", "refs": ["campus"], "prompt": "Bottom-up design starts with the availability of existing technology and then adapts to meet business goals.", "source": {"title": "MOCK TCA - supplied CCCU mock", "originalQuestion": 63, "stem": "Original wording retained; PDF line wraps, font ligatures and blank placeholders normalised."}}, {"id": "cccu-mock-original-q064", "originalNumber": 64, "topic": "campus", "type": "single", "answer": 3, "explanation": "A required continuously accessible library or student portal makes availability a service requirement. A single appliance can instead be a failure dependency.", "objective": "Identify a high-availability requirement.", "refs": ["ha"], "prompt": "Which scenario best demonstrates the need for high availability in a university network design?", "  "reason": "Repeats where MAC addressing belongs."}, {"originalNumber": 40, "coveredBy": [44], "reason": "Repeats the conventional HTTP service-port association."}, {"originalNumber": 47, "coveredBy": [41], "reason": "Repeats all four lower-layer/function mappings from Q41."}, {"originalNumber": 48, "coveredBy": [41, 43, 45], "reason": "Repeats routing, MAC, presentation and application roles already covered; its source answer bank is incomplete."}, {"originalNumber": 49, "coveredBy": [42, 56, 63, 76], "reason": "All four statements repeat modularity/troubleshooting, VLAN benefits, bottom-up design and Zero Trust."}, {"originalNumber": 50, "coveredBy": [39, 41, 43, 81], "reason": "Repeats link error detection, IP routing, presentation/security and application service roles."}, {"originalNumber": 52, "coveredBy": [58], "reason": "Q58 retains the same distribution aggregation fact and adds its policy role."}, {"originalNumber": 59, "coveredBy": [79], "reason": "Repeats validation before going live; Q79 states its purpose directly."}, {"originalNumber": 60, "coveredBy": [56], "reason": "Repeats the need for security zoning/segmentation without a new technical distinction."}, {"originalNumber": 66, "coveredBy": [37, 56, 58], "reason": "Revisits VLAN/policy placement already covered and is ambiguous between access VLAN membership and distribution policy."}, {"originalNumber": 67, "coveredBy": [56], "reason": "Repeats VLAN segmentation and security zoning."}, {"originalNumber": 68, "coveredBy": [51], "reason": "Repeats the definition of hybrid design."}, {"originalNumber": 71, "coveredBy": [51], "reason": "Repeats hybrid design as the combination of goals and technology constraints."}, {"originalNumber": 75, "coveredBy": [53], "reason": "Repeats the business-requirements starting point of top-down design."}, {"originalNumber": 77, "coveredBy": [55], "reason": "Repeats the same design tools; both GNS3 and Packet Tracer in its options are defensible."}, {"originalNumber": 7 ished. The explanatory answer key is technically reviewed practice guidance, not an official CCCU key."}</script><script>
const normalise=value=>String(value??'').normalize('NFKC').toLowerCase().trim().replace(/[.,;:!?]+$/g,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
function groupOf(q,v){return q.groups.findIndex(g=>g.some(x=>normalise(x)===normalise(v)))}
function complete(q,a){
 if(q.type==='short')return typeof a==='string'&&a.trim().length>0;
 if(q.type==='single')return Number.isInteger(a)&&a>=0&&a<q.options.length;
 if(q.type==='truefalse')return typeof a==='boolean';
 if(q.type==='blanks')return Array.isArray(a)&&a.length===q.fields.length&&a.every(x=>typeof x==='string'&&x.trim().length>0);
 if(q.type==='matching')return Array.isArray(a)&&a.length===q.items.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<q.options.length)&&(q.reuseOptions||new Set(a).size===a.length);
 return false;
}
function grade(q,a){
 if(!complete(q,a))return false;
 if(q.type==='short')return q.answer.some(x=>normalise(x)===normalise(a));
 if(q.type==='blanks'){const g=a.map(v=>groupOf(q,v));return g.every(x=>x>=0)&&new Set(g).size>=q.minimumDistinct&&(q.unordered||g.every((v,i)=>v===i))}
 if(q.type==='matching')return q.answer.every((v,i)=>(q.acceptedPerItem?.[i]||[v]).includes(a[i]));
 if(q.type==='single')return (q.acceptedAnswers||[q.answer]).includes(a);
 return q.answer===a;
}
function assess(exam,ids,answers){
 const selected=ids.map(id=>exam.questions.find(q=>q.id===id));if(selected.some(q=>!q)||new Set(ids).size!==ids.length)throw Error('Invalid question selection');
 const results=selected.map(q=>({id:q.id,topic:q.topic,scored:q.scored!==false,correct:q.scored===false?null:grade(q,answers[q.id]),answered:complete(q,answers[q.id])}));
 const scored=results.filter(r=>r.scored);
 const topics=Object.entries(exam.topics).map(([id,t])=>{const rows=scored.filter(r=>r.topic===id);return {id,name:t.name,total:rows.length,correct:rows.filter(r=>r.correct).length,missed:rows.filter(r=>!r.correct).map(r=>r.id)}}).filter(t=>t.total).sort((a,b)=>a.correct/a.total-b.correct/b.total||b.missed.length-a.missed.length);
 return {score:scored.filter(r=>r.correct).length,total:scored.length,questionCount:results.length,reviewOnly:results.length-scored.length,unanswered:scored.filter(r=>!r.answered).length,missed:scored.filter(r=>!r.correct).map(r=>r.id),results,topics};
}
function validateExam(exam){
 if(exam?.schemaVersion!==1||typeof exam.id!=='string'||typeof exam.version!=='string'||typeof exam.title!=='string'||typeof exam.description!=='string'||typeof exam.scoring?.rule!=='string'||!exam.topics||!exam.sources||!Array.isArray(exam.questions)||!exam.questions.length||exam.questions.length>300)throw Error('Unsupported exam file');
 const ids=new Set(),numbers=new Set();
 for(const t of Object.values(exam.topics))if(typeof t.name!=='string'||typeof t.revise!=='string'||typeof t.check!=='string')throw Error('Invalid topic feedback');
 for(const s of Object.values(exam.sources))if(!Array.isArray(s)||typeof s[0]!=='string'||typeof s[1]!=='string'||!/^https:\/\//.test(s[1]))throw Error('Invalid reference');
 for(const q of exam.questions){
  if(!q.id||ids.has(q.id)||!q.prompt||!q.objective||!q.explanation||!exam.topics[q.topic]||!q.refs?.length||q.refs.some(r=>!exam.sources[r]))throw Error('Incomplete or duplicate question');ids.add(q.id);
  if(!Number.isInteger(q.originalNumber)||numbers.has(q.originalNumber))throw Error('Missing or duplicate source number');numbers.add(q.originalNumber);
  if(!['single','truefalse','short','blanks','matching'].includes(q.type))throw Error('Unsupported question format');
  if(q.scored===false&&!q.reviewAnswer)throw Error('Review-only item needs guidance');
  if(['single','matching'].includes(q.type)&&(!Array.isArray(q.options)||q.options.length<2||new Set(q.options).size!==q.options.length))throw Error('Invalid option bank');
  if(q.type==='short'&&(!Array.isArray(q.answer)||!q.answer.length||q.answer.some(a=>typeof a!=='string'||!a.trim())))throw Error('Invalid aliases');
  if(q.type==='blanks'&&(!Array.isArray(q.fields)||!Array.isArray(q.groups)||q.groups.length<q.fields.length||q.groups.some(g=>!Array.isArray(g)||!g.length)||q.minimumDistinct!==q.fields.length))throw Error('Invalid multi-blank question');
  if(q.type==='matching'&&(!Array.isArray(q.items)||q.items.length!==q.answer.length||q.acceptedPerItem&&(q.acceptedPerItem.length!==q.items.length||q.acceptedPerItem.some(g=>!g.length||g.some(i=>!Number.isInteger(i)||i<0||i>=q.options.length)))))throw Error('Invalid matching question');
  if(!grade(q,q.type==='short'?q.answer[0]:q.answer))throw Error('Invalid key: '+q.id);
 }
 return exam;
}
function shuffle(items,rng=Math.random){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function answerLabel(q,a){
 if(a===undefined||a===null||a===''||Array.isArray(a)&&!a.length)return 'Unanswered';

 if(q.type==='single')return q.options[a]??'Unanswered';

 if(q.type==='blanks')return q.fields.map((f,i)=>f+': '+(a[i]||'Unanswered')).join('; ');
 if(q.type==='matching')return q.items.map((f,i)=>f+' → '+(q.options[a[i]]??'Unanswered')).join(' • ');
 return 'Unanswered';
}
function keyLabel(q){return q.scored===false?q.reviewAnswer:answerLabel(q,q.type==='short'?q.answer[0]:q.answer)}

let storageKey='uniquiz-mock-v1:'+exam.id;
const typeNames={single:'Choose one',truefalse:'True or false',short:'Fill in the blank',blanks:'Fill in multiple blanks',matching:'Matching'};
function loadSaved(){state=null;history=[];try{const s=JSON.parse(localStorage.getItem(storageKey)||'null');if(s?.version===exam.version){history=Array.isArray(s.history)?s.history.slice(-10):[];if(s.state&&Array.isArray(s.state.ids)&&s.state.ids.length&&s.state.ids.every(id=>exam.questions.some(q=>q.id===id))&&new Set(s.state.ids).size===s.state.ids.length&&s.state.answers&&s.state.display&&Number.isInteger(s.state.index)){state=s.state;state.index=Math.max(0,Math.min(state.index,state.ids.length-1));state.flags=Array.isArray(state.flags)?state.flags:[];}}}catch{storageOK=false}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({version:exam.version,state,history}));return true}catch{storageOK=false;document.querySelector('#save-status').textContent='Saving is unavailable. Keep this page open; you can still finish and download your result.';return false}}
function draw(html){main.innerHTML=html;main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});document.querySelector('#save-status').textContent=storageOK?'Answers stay in this browser. No account needed.':'Saving is unavailable; keep this page open to retain this attempt.'}
function download(name,data,type='application/json'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resources(t){const topic=exam.topics[t],v=topic.video;const url=v&&/^[-\w]{11}$/.test(v.id)?`https://www.youtube.com/watch?v=${v.id}&t=${Number.isInteger(v.start)?v.start:0}s`:null;return url?`<p><a href="${url}" target="_blank" rel="noopener noreferrer">Related lesson on YouTube</a><br><small>${esc(v.title)} · ${esc(v.channel)}. Use the written checklist for the complete topic.</small></p>`:''}
function intro(){
 const counts={};exam.questions.forEach(q=>counts[q.type]=(counts[q.type]||0)+1);
 draw(`<section class="hero"><span class="eyebrow">UniQuiz · independent practice</span><h1>${esc(exam.title)}</h1><p>${esc(exam.description)}</p><div class="pills"><span class="pill">${exam.questions.length} distinct questions</span><span class="pill">${exam.questions.filter(q=>q.scored!==false).length} available marks</span><span class="pill">4 original question formats</span><span class="pill">Untimed</span></div></section><section class="panel"><h2>Take the mock</h2><p>Work through one question at a time. Skip, return or flag questions before you submit. Your draft saves automatically where browser storage is available. Explanations and revision advice appear after marking.</p><p><strong>Marking:</strong> ${esc(exam.scoring.rule)}</p><p class="muted">Original wording and order are preserved; original PDF question numbers are shown throughout. Matching option banks have been restored where the export omitted unselected options. These practice marks are not an official CCCU answer key or marking scheme.</p><div class="actions">${state?`<button class="primary" id="resume">${state.finished?'View saved result':'Resume saved attempt'}</button>`:''}<button ${state?'class="secondary"':'class="primary"'} id="new">Start a fresh full mock</button></div><div id="replace"></div></section><div class="grid"><section class="panel"><h2>What you will practise</h2><ul>${Object.values(exam.topics).map(t=>`<li>${esc(t.name)}</li>`).join('')}</ul></section><section class="panel"><h2>Question mix</h2><ul>${Object.entries(counts).map(([t,n])=>`<li>${n} ${esc(typeNames[t].toLowerCase())} questions</li>`).join('')}</ul><p>35 repeated questions were removed after comparing their tested facts with retained questions. Fill-in and matching formats remain as in the source, using keyboard-accessible fields and menus.</p></section></div>${history.length?`<section class="panel"><h2>Recent attempts in this browser</h2><ul>${history.slice().reverse().map(h=>`<li>${esc(new Date(h.at).toLocaleString())} · ${esc(h.mode)} · ${h.score}/${h.total}</li>`).join('')}</ul><p class="small">Up to ten completed attempts are kept. Results are local to this browser and do not sync between devices.</p></section>`:''}<details class="panel"><summary>Files and authoring</summary><p>This downloadable JSON includes answer keys and explanations. It uses the UniQuiz mixed-format schema included with this runner. It is separate from the existing MCQ bank.</p><div class="actions"><button id="export-bank">Download exam JSON (includes answers)</button><label class="button" for="import-bank">Import compatible exam JSON</label><input class="visually-hidden" id="import-bank" type="file" accept=".json,application/json"></div><p id="import-status" role="status"></p></details>`);
 document.querySelector('#new').onclick=()=>{if(state&&!state.finished){document.querySelector('#replace').innerHTML='<p class="notice">Starting fresh replaces the unfinished mock draft in this browser. Completed attempt summaries remain.</p><button class="danger" id="replace-confirm">Replace draft and start</button>';document.querySelector('#replace-confirm').onclick=()=>start(exam.questions.map(q=>q.id),'Full mock')}else start(exam.questions.map(q=>q.id),'Full mock')};
 if(state)document.querySelector('#resume').onclick=()=>state.finished?results():question();
 document.querySelector('#export-bank').onclick=()=>download('networking-original-mock.json',JSON.stringify(exam,null,2));
 document.querySelector('#import-bank').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error('File is too large');const candidate=validateExam(JSON.parse(await file.text()));if(state&&!state.finished){document.querySelector('#import-status').textContent='Finish the current attempt before importing another exam.';return}exam=candidate;storageKey='uniquiz-mock-v1:'+exam.id;loadSaved();intro()}catch{document.querySelector('#import-status').textContent='This is not a valid UniQuiz mixed-format exam file. Your current exam is unchanged.'}};
}
function start(ids,mode){state={ids:exam.preserveOrder?[...ids]:shuffle(ids),mode,index:0,answers:{},flags:[],display:{},finished:false,started:Date.now()};for(const id of ids){const q=exam.questions.find(q=>q.id===id);state.display[id]=(q.options||[]).map((_,i)=>i);}save();question()}
function optionOrder(q){const o=state.display[q.id],n=(q.type==='ordering'?q.items:q.options||[]).length;return Array.isArray(o)&&o.length===n&&new Set(o).size===n?o:Array.from({length:n},(_,i)=>i)}
function answeredCount(){return state.ids.filter(id=>complete(exam.questions.find(q=>q.id===id),state.answers[id])).length}
function question(){
 if(!state||state.finished)return intro();
 const q=exam.questions.find(q=>q.id===state.ids[state.index]),a=state.answers[q.id],done=answeredCount(),order=optionOrder(q);let controls='';
 if(q.type==='single'||q.type==='multiple')controls=`<fieldset><legend>${q.type==='multiple'?`Select exactly ${q.select} answers.`:'Choose one answer.'}</legend><div class="answers">${order.map(i=>`<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="choice" value="${i}" ${q.type==='single'?(a===i?'checked':''):(Array.isArray(a)&&a.includes(i)?'checked':'')}><span>${esc(q.options[i])}</span></label>`).join('')}</div></fieldset>`;
 if(q.type==='truefalse')controls=`<fieldset><legend>Choose True or False.</legend><div class="answers">${[true,false].map(v=>`<label class="option"><input type="radio" name="choice" value="${v}" ${a===v?'checked':''}><span>${v?'True':'False'}</span></label>`).join('')}</div></fieldset>`;
 if(q.type==='short')controls=`<label for="short-answer"><strong>Your answer</strong></label><p class="small">Case and extra spacing are ignored. Standard equivalent terms listed in the key are accepted; write the requested term or number.</p><input id="short-answer" type="text" autocomplete="off" maxlength="200" value="${esc(a||'')}">`;
 if(q.type==='blanks')controls=`<p>Enter one answer in each original blank. Case and extra spaces are ignored.</p>${q.fields.map((f,i)=>`<div class="pair"><label for="blank-${i}">${esc(f)}</label><input id="blank-${i}" type="text" maxlength="100" autocomplete="off" data-blank="${i}" value="${esc(Array.isArray(a)?a[i]||'':'')}"></div>`).join('')}`;
 if(q.type==='matching'||q.type==='ordering')controls=`<p>${q.type==='matching'?'Choose one match for each original row. An option may be used more than once when its wording fits.':'Choose the item for each position, from first to last. Use each item once.'}</p>${q.items.map((item,i)=>`<div class="pair"><label for="part-${i}">${q.type==='matching'?esc(item):`Position ${i+1}`}</label><select id="part-${i}" data-part="${i}"><option value="">Choose…</option>${order.map(j=>`<option value="${j}" ${Array.isArray(a)&&a[i]===j?'selected':''}>${esc(q.type==='matching'?q.options[j]:q.items[j])}</option>`).join('')}</select></div>`).join('')}`;
 draw(`<div class="topline"><span>${esc(state.mode)} · ${state.index+1} of ${state.ids.length}</span><button id="home">Save and leave</button></div><div class="track" aria-label="${done} of ${state.ids.length} answered"><span style="width:${done/state.ids.length*100}%"></span></div><div class="exam-layout"><section class="panel question"><div class="topline"><span class="eyebrow">${esc(typeNames[q.type])} · ${q.scored===false?'Review only':'1 mark'} · Original Q${q.originalNumber}</span><span class="muted">${esc(exam.topics[q.topic].name)}</span></div><h1>${esc(q.prompt)}</h1>${q.scored===false?'<p class="notice">This original question has ambiguous wording and is retained for discussion. It does not affect your score.</p>':''}${controls}<p id="part-status" class="inline-status" role="status"></p><div class="actions"><button id="previous" ${state.index===0?'disabled':''}>Previous</button><button class="primary" id="next">${state.index===state.ids.length-1?'Review submission':'Save and next'}</button><button id="flag" aria-pressed="${state.flags.includes(q.id)}">${state.flags.includes(q.id)?'Remove flag':'Flag for review'}</button><button id="clear">Clear answer</button></div><p class="small" style="margin-top:18px">No answers or explanations are shown until you submit.</p></section><aside class="panel nav-panel"><h2>Question navigator</h2><p id="count">${done} / ${state.ids.length} answered</p><p class="small">Blue = answered · dot = flagged. Original question numbers remain visible on every question.</p><details><summary>Jump to a question</summary><div class="number-grid">${state.ids.map((id,i)=>`<button class="${i===state.index?'current ':''}${complete(exam.questions.find(q=>q.id===id),state.answers[id])?'done ':''}${state.flags.includes(id)?'flagged':''}" data-jump="${i}" aria-label="Question ${i+1}${state.flags.includes(id)?', flagged':''}" ${i===state.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div></details><button id="submit-review">Review submission</button></aside></div>`);
 function update(){save();const count=answeredCount();document.querySelector('#count').textContent=`${count} / ${state.ids.length} answered`;document.querySelector('.track span').style.width=(count/state.ids.length*100)+'%';document.querySelector('.track').setAttribute('aria-label',`${count} of ${state.ids.length} answered`);const nav=document.querySelector(`[data-jump="${state.index}"]`);nav.classList.toggle('done',complete(q,state.answers[q.id]));const ans=state.answers[q.id];document.querySelector('#part-status').textContent=q.type==='multiple'&&Array.isArray(ans)&&ans.length!==q.select?`Selected ${ans.length}; choose exactly ${q.select}.`:(['matching','ordering'].includes(q.type)&&!q.reuseOptions&&Array.isArray(ans)&&ans.filter(Number.isInteger).length!==new Set(ans.filter(Number.isInteger)).size?'Use every option once; a selection is repeated.':'')}
 document.querySelectorAll('input[name=choice]').forEach(el=>el.onchange=()=>{state.answers[q.id]=q.type==='single'?Number(el.value):q.type==='truefalse'?el.value==='true':[...document.querySelectorAll('input[name=choice]:checked')].map(x=>Number(x.value));update()});
 if(q.type==='short')document.querySelector('#short-answer').oninput=e=>{state.answers[q.id]=e.target.value;update()};
 document.querySelectorAll('[data-blank]').forEach(el=>el.oninput=()=>{const arr=Array.isArray(state.answers[q.id])?[...state.answers[q.id]]:Array(q.fields.length).fill('');arr[Number(el.dataset.blank)]=el.value;state.answers[q.id]=arr;update()});
 document.querySelectorAll('[data-part]').forEach(el=>el.onchange=()=>{const arr=Array.isArray(state.answers[q.id])?[...state.answers[q.id]]:Array(q.items.length).fill(null);arr[Number(el.dataset.part)]=el.value===''?null:Number(el.value);state.answers[q.id]=arr;update()});
 document.querySelector('#previous').onclick=()=>{state.index--;save();question()};document.querySelector('#next').onclick=()=>{if(state.index===state.ids.length-1)submission();else{state.index++;save();question()}};
 document.querySelector('#home').onclick=()=>{save();intro()};document.querySelector('#submit-review').onclick=submission;
 document.querySelector('#flag').onclick=()=>{state.flags=state.flags.includes(q.id)?state.flags.filter(id=>id!==q.id):[...state.flags,q.id];save();question()};
 document.querySelector('#clear').onclick=()=>{delete state.answers[q.id];save();question()};document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{state.index=Number(el.dataset.jump);save();question()});
}
function submission(){const missing=state.ids.filter(id=>!complete(exam.questions.find(q=>q.id===id),state.answers[id]));draw(`<section class="panel"><span class="eyebrow">Before marking</span><h1>Ready to submit?</h1><p><strong>${answeredCount()} of ${state.ids.length} questions have complete answers.</strong> ${state.flags.length} flagged for review.</p>${missing.length?`<p class="notice">${missing.length} unanswered or incomplete questions will score zero. Every blank or matching row must be completed. The review-only item never reduces your marks.</p>`:'<p class="good">Every question has a complete answer.</p>'}<p>${esc(exam.scoring.rule)} Your attempt is locked once marked. You can then retake the exam or practise mistakes.</p><div class="actions"><button id="return">Return to questions</button>${missing.length?'<button id="first-missing">Go to first incomplete</button>':''}<button class="primary" id="finish">Finish and mark ${state.ids.length} questions</button></div></section>`);document.querySelector('#return').onclick=question;if(missing.length)document.querySelector('#first-missing').onclick=()=>{state.index=state.ids.indexOf(missing[0]);save();question()};document.querySelector('#finish').onclick=()=>{if(state.finished)return;state.finished=true;state.finishedAt=Date.now();const r=assess(exam,state.ids,state.answers);history.push({at:new Date().toISOString(),mode:state.mode,score:r.score,total:r.total});history=history.slice(-10);save();reviewMode='missed';results()}}
function results(){const r=assess(exam,state.ids,state.answers);draw(`<section class="hero"><span class="eyebrow">${esc(state.mode)} · marked</span><h1>Your results and next steps</h1><div class="stats">${r.score}<span> / ${r.total}</span></div><p>${r.total?Math.round(r.score/r.total*100):0}% correct · ${r.missed.length} questions to revisit · ${r.unanswered} scored questions unanswered or incomplete. ${r.reviewOnly} review-only question(s) excluded from the score.</p><p class="muted">Practice score only. There is no official pass threshold assigned to this independent mock.</p><div class="actions"><button class="primary" id="retake">Retake all ${exam.questions.length}</button><button id="retry" ${r.missed.length?'':'disabled'}>Practise ${r.missed.length} mistakes</button><button id="export-result">Download my result</button><button id="home">Exam home</button></div></section><section><h2>Your revision priorities</h2><p>${r.missed.length?'Topics with the lowest accuracy appear first. Read the explanation for each missed objective, revise it, then try it again without the key.':'Every question in this attempt is correct. Use a fresh full attempt later to check retention.'}</p><div class="grid">${r.topics.map(t=>`<article class="topic"><span class="eyebrow">${t.missed.length?(t.correct/t.total<.6?'Revise first':t.correct/t.total<.8?'Practise next':'Consolidate'):'Secure in this attempt'}</span><h3>${esc(t.name)} · ${t.correct}/${t.total}</h3><p>${esc(t.missed.length?exam.topics[t.id].revise:'Keep this area active with spaced retrieval; one attempt does not prove lasting mastery.')}</p>${t.missed.length?`<p><strong>Checkpoint:</strong> ${esc(exam.topics[t.id].check)}</p>${resources(t.id)}`:''}</article>`).join('')}</div></section><section style="margin-top:30px"><h2>Question review</h2><label for="review-filter">Show </label><select id="review-filter"><option value="missed" ${reviewMode==='missed'?'selected':''}>Mistakes and incomplete answers</option><option value="all" ${reviewMode==='all'?'selected':''}>All questions and explanations</option></select><div id="reviews"></div></section>`);
 document.querySelector('#retake').onclick=()=>start(exam.questions.map(q=>q.id),'Full mock');document.querySelector('#retry').onclick=()=>start(r.missed,'Mistakes practice');document.querySelector('#home').onclick=intro;
 document.querySelector('#export-result').onclick=()=>download('networking-mock-result.json',JSON.stringify({examId:exam.id,version:exam.version,completed:new Date(state.finishedAt).toISOString(),mode:state.mode,...r,answers:state.answers},null,2));document.querySelector('#review-filter').onchange=e=>{reviewMode=e.target.value;reviews(r)};reviews(r)}
function reviews(r){const items=r.results.filter(x=>reviewMode==='all'||!x.correct);document.querySelector('#reviews').innerHTML=items.length?items.map(row=>{const q=exam.questions.find(q=>q.id===row.id);return `<article class="review-item"><span class="eyebrow">Question ${state.ids.indexOf(q.id)+1} · Original Q${q.originalNumber} · ${!row.scored?'Discussion · not scored':row.correct?'Correct':'Review needed'} · ${esc(exam.topics[q.topic].name)}</span><h3>${esc(q.prompt)}</h3><p class="review-answer"><strong>Your answer:</strong> ${esc(answerLabel(q,state.answers[q.id]))}</p><p class="review-answer"><strong>${q.scored===false?'Discussion guidance':'Correct / accepted answer'}:</strong> ${esc(keyLabel(q))}</p>${q.type==='short'?`<details><summary>Accepted equivalents</summary><p>${q.answer.map(esc).join('; ')}</p></details>`:''}<p>${esc(q.explanation)}</p>${q.optionProvenance?`<p class="small"><strong>Source options:</strong> ${esc(q.optionProvenance)}</p>`:''}<p class="small"><strong>Revise:</strong> ${esc(q.objective)}</p><div class="source-links">${q.refs.map(id=>{const s=exam.sources[id];return /^https:\/\//.test(s[1])?`<a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a>`:''}).join('')}</div></article>`}).join(''):'<p class="good">No mistakes to show in this attempt. Choose “All questions and explanations” to review the complete answer key.</p>'}
loadSaved();intro();

</script></body></html>
